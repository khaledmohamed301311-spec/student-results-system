<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام نتائج الطلاب</title>
<style>
body{font-family:Arial;background:#f0f2f5;margin:0;padding:15px}
.card{background:#fff;padding:20px;border-radius:15px;max-width:600px;margin:auto;box-shadow:0 2px 10px #0002}
h1{text-align:center;color:#6a11cb}
input,button{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #ddd;font-size:16px;box-sizing:border-box}
button{background:#6a11cb;color:#fff;border:none;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#6a11cb;color:#fff}
.success{background:#d4edda;padding:10px;border-radius:10px;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>🎓 نظام نتائج الطلاب</h1>
<h3>🔍 استعلام عن نتيجة</h3>
<input id="searchCode" placeholder="اكتب كود الطالب مثال: 101">
<button onclick="search()">عرض النتيجة</button>
<div id="result"></div>
<hr>
<h3>➕ إضافة طالب جديد</h3>
<input id="name" placeholder="اسم الطالب">
<input id="code" placeholder="كود الطالب">
<input id="arabic" type="number" placeholder="درجة العربي">
<input id="math" type="number" placeholder="درجة الرياضيات">
<input id="english" type="number" placeholder="درجة الانجليزي">
<button onclick="addStudent()">حفظ الطالب</button>
<h3>📋 كل الطلاب</h3>
<div id="list"></div>
</div>
<script>
let students = JSON.parse(localStorage.getItem('students')||'[]');
function save(){ localStorage.setItem('students', JSON.stringify(students)); show(); }
function addStudent(){
 let s={name:document.getElementById('name').value, code:document.getElementById('code').value, arabic:document.getElementById('arabic').value, math:document.getElementById('math').value, english:document.getElementById('english').value};
 if(!s.name||!s.code){alert('اكتب الاسم والكود');return;}
 students.push(s); save(); alert('تم الحفظ ✅');
}
function search(){
 let c=document.getElementById('searchCode').value;
 let s=students.find(x=>x.code==c);
 if(!s){document.getElementById('result').innerHTML='❌ مش موجود';return;}
 let total=+s.arabic + +s.math + +s.english;
 document.getElementById('result').innerHTML=`<div class="success"><b>${s.name}</b><br>عربي: ${s.arabic} | رياضيات: ${s.math} | انجليزي: ${s.english}<br><b>المجموع: ${total} من 300</b></div>`;
}
function show(){
 let h='<table><tr><th>الاسم</th><th>الكود</th><th>المجموع</th></tr>';
 students.forEach(s=>{ h+=`<tr><td>${s.name}</td><td>${s.code}</td><td>${+s.arabic+ +s.math+ +s.english}</td></tr>`; });
 h+='</table>'; document.getElementById('list').innerHTML=h;
}
show();
</script>
</body>
</html>
